name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy --strict (all of src/twin)
        run: uv run mypy src/twin

      - name: pytest with coverage (live tests are skipped)
        run: uv run pytest -q -m "not live" --cov=src/twin --cov-report=json

      - name: coverage gate (total >= 85%, each package >= 75%)
        run: uv run python scripts/coverage_gate.py

      - name: privacy scan
        run: uv run python scripts/privacy_scan.py

      - name: traceability (global consistency)
        run: uv run python scripts/trace_check.py

      - name: smoke test of the CLI
        run: |
          uv run twin --help
          uv run twin doctor
