# Install with:  uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: privacy-scan
        name: privacy scan (R-PRIV-001)
        entry: uv run python scripts/privacy_scan.py
        language: system
        pass_filenames: true
        require_serial: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
        require_serial: true
