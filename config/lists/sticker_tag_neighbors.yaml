# Nearby tags (R-STK-004).  When no sticker of hers carries the tag the model asked for, the
# selector tries these tags in the order given, nearest first, before it gives up and the line
# is deleted.  Every key and every entry must be a tag of sticker_tags.txt (a test checks it).
# The relation does not have to be symmetric.
