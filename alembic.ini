# Alembic configuration for `uv run alembic upgrade head` (CLAUDE.md section 5).
# The database path is taken from the project settings (paths.data_dir) unless
# sqlalchemy.url is set.  `twin db upgrade` does the same without this file.
[alembic]
script_location = src/twin/storage/migrations
# sqlalchemy.url = sqlite:///data/twin.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
