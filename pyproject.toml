[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wechat-twin"
version = "0.1.0"
description = "Single-user WeChat persona chatbot (local-first, encrypted storage)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "cryptography>=43",
    "keyring>=25",
    "httpx>=0.27",
    "openai>=2.54,<3",
    "pillow>=12.3",
    "ijson>=3.3",
    "tzdata>=2024.2",
    "chinese-calendar>=1.10",
    "holidays>=0.60",
    "orjson>=3.10",
    "qrcode>=8.0",
    "sentence-transformers>=3.3",
    "lancedb>=0.17",
    "numpy>=1.26",
    "torch>=2.4",  # direct so that [tool.uv.sources] picks the CPU build on Linux
    "jinja2>=3.1",
    "zstandard>=0.23",
    "asyncssh>=2.18",
    "tokenizers>=0.21",  # token counts of the training export (round 13b)
]

[project.scripts]
twin = "twin.cli:app"

# torch: on Linux (CI, sandboxes) the CPU-only build from the PyTorch index, which is a few hundred
# MB instead of several GB of CUDA libraries; on Windows the PyPI wheel is already CPU-only.  A
# Windows PC with an NVIDIA card installs the CUDA build of torch by hand
# (docs/PENDING_USER_ACTIONS.md, round 05).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "time-machine>=2.16",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
    "shellcheck-py>=0.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/twin"]

[tool.hatch.build.targets.sdist]
include = ["src/twin", "config", "training", "docs", "README.md", "pyproject.toml"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]


[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "C4", "SIM", "PT", "RUF", "ASYNC", "PIE", "TID",
    "DTZ",   # naive datetime is forbidden (CLAUDE.md rule 5)
    "S",     # security rules
    "T20",   # no print() in library code
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Chinese full-width punctuation in strings/comments is intended
    "S608",                        # SQL built from constants only; reviewed per call site
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607", "PT011", "PT012", "PT018", "T20"]
"scripts/**" = ["T20", "S603", "S607", "S101"]
"src/twin/llm/probe_report.py" = ["E501"]  # prose of the written report
"src/twin/channel/probe/report.py" = ["E501"]  # prose of the written report
"src/twin/engine/command_port.py" = ["E501"]  # the one-line description is fixed text shared with round 09-3

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/twin"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["chinese_calendar", "chinese_calendar.*", "ijson", "ijson.*", "qrcode", "qrcode.*", "pyarrow", "pyarrow.*", "lancedb", "lancedb.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# -------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: multi-component or multi-process tests",
    "live: touches the real network or real services; skipped unless TWIN_LIVE=1",
    "windows: runs only on Windows",
]
filterwarnings = [
    "error::DeprecationWarning:twin",
    "error::ResourceWarning:twin",
]

# ------------------------------------------------------------ coverage
[tool.coverage.run]
source = ["src/twin"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "# pragma: win32-only",
    "raise AssertionError",
]

[tool.coverage.json]
pretty_print = true
