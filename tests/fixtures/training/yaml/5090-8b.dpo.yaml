### LLaMA-Factory 0.9.5 - DPO on top of the SFT adapter (5090-8b)
### rendered by twin.training.yaml_render; do not edit by hand
### The reference model of a preference run is the SFT model, never the bare base (D-650).
### layered (bf16 profile): LLaMA-Factory merges the SFT adapter into the base in memory and trains a
### NEW adapter on top of it (create_new_adapter).  No ref_model is set, so the trainer switches the
### new adapter off for the reference pass: the reference is the merged SFT model - no second copy
### in VRAM, no merged copy on disk.  output/dpo is the delta over SFT; the adapter stack is sft,dpo.

### model
model_name_or_path: /root/autodl-tmp/models/Qwen/Qwen3-8B
adapter_name_or_path: /root/autodl-tmp/twin/output/sft
create_new_adapter: true
trust_remote_code: false
flash_attn: sdpa

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid

### dataset
dataset: twin_dpo_train
dataset_dir: /root/autodl-tmp/twin/data
template: qwen3_nothink
cutoff_len: 2048
preprocessing_num_workers: 8
dataloader_num_workers: 2
seed: 42

### output
output_dir: /root/autodl-tmp/twin/output/dpo
logging_steps: 5
save_steps: 100
save_total_limit: 2
save_only_model: false
plot_loss: true
overwrite_output_dir: false
report_to: none
resume_from_checkpoint: null

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
